<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Francis Xavier Osindo — Senior Mobile &amp; Backend Engineer</title>
  <desc id="desc">Native Android, native iOS, Kotlin Multiplatform and Spring Boot. I build digital products that hold up in the real world.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030303"/>
      <stop offset=".55" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#13213C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".45" r=".45">
      <stop offset="0" stop-color="#FCA311" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FCA311" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5E5E5" stroke-opacity=".05"/>
    </pattern>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.8); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .blink { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#FCA311"/>

  <!-- Left: identity -->
  <g class="sans">
    <rect x="72" y="78" width="30" height="2" fill="#FCA311"/>
    <text x="114" y="84" fill="#E5E5E5" font-size="14" font-weight="700" letter-spacing="2.6">SENIOR MOBILE &amp; BACKEND ENGINEER</text>

    <text x="70" y="152" fill="#FDFDFD" font-size="58" font-weight="800" letter-spacing="-2">Francis Xavier</text>
    <text x="70" y="214" fill="#FDFDFD" font-size="58" font-weight="800" letter-spacing="-2">Osindo<tspan fill="#FCA311">.</tspan></text>

    <text x="72" y="258" fill="#a8afbc" font-size="19">I build digital products that <tspan fill="#FCA311" font-weight="700">hold up in the real world.</tspan></text>

    <!-- Stack chips -->
    <g font-size="13" font-weight="700" letter-spacing=".4">
      <rect x="72" y="284" width="96" height="30" rx="15" fill="none" stroke="#3DDC84" stroke-opacity=".7"/>
      <text x="120" y="304" fill="#E5E5E5" text-anchor="middle">Android</text>
      <rect x="178" y="284" width="64" height="30" rx="15" fill="none" stroke="#E5E5E5" stroke-opacity=".6"/>
      <text x="210" y="304" fill="#E5E5E5" text-anchor="middle">iOS</text>
      <rect x="252" y="284" width="164" height="30" rx="15" fill="none" stroke="#7F52FF" stroke-opacity=".9"/>
      <text x="334" y="304" fill="#E5E5E5" text-anchor="middle">Kotlin Multiplatform</text>
      <rect x="426" y="284" width="120" height="30" rx="15" fill="none" stroke="#6DB33F" stroke-opacity=".8"/>
      <text x="486" y="304" fill="#E5E5E5" text-anchor="middle">Spring Boot</text>
    </g>

    <circle cx="80" cy="345" r="5" fill="#3DDC84" class="pulse"/>
    <circle cx="80" cy="345" r="5" fill="#3DDC84"/>
    <text x="96" y="350" fill="#a8afbc" font-size="14">Open to consulting &amp; selected roles — in any industry</text>
  </g>

  <!-- Right: one product system (phones ⇄ API) -->
  <g transform="translate(700 66)">
    <!-- Android phone -->
    <g>
      <rect x="0" y="22" width="132" height="236" rx="20" fill="#0B1426" stroke="#E5E5E5" stroke-opacity=".28" stroke-width="2"/>
      <rect x="50" y="32" width="32" height="5" rx="2.5" fill="#E5E5E5" fill-opacity=".25"/>
      <rect x="14" y="52" width="104" height="44" rx="8" fill="#FCA311"/>
      <text x="24" y="72" class="sans" fill="#030303" font-size="11" font-weight="800">500K+</text>
      <text x="24" y="87" class="sans" fill="#030303" font-size="9" font-weight="600">monthly users</text>
      <rect x="14" y="106" width="104" height="10" rx="5" fill="#E5E5E5" fill-opacity=".18"/>
      <rect x="14" y="124" width="74" height="10" rx="5" fill="#E5E5E5" fill-opacity=".12"/>
      <rect x="14" y="146" width="48" height="48" rx="8" fill="#13213C" stroke="#3DDC84" stroke-opacity=".6"/>
      <rect x="70" y="146" width="48" height="48" rx="8" fill="#13213C" stroke="#E5E5E5" stroke-opacity=".2"/>
      <rect x="14" y="206" width="104" height="30" rx="15" fill="none" stroke="#3DDC84" stroke-opacity=".8"/>
      <text x="66" y="225" class="sans" fill="#3DDC84" font-size="10" font-weight="700" text-anchor="middle">ANDROID</text>
    </g>
    <!-- iOS phone -->
    <g transform="translate(150 0)">
      <rect x="0" y="22" width="132" height="236" rx="24" fill="#0B1426" stroke="#E5E5E5" stroke-opacity=".28" stroke-width="2"/>
      <rect x="44" y="32" width="44" height="12" rx="6" fill="#030303"/>
      <rect x="14" y="56" width="104" height="44" rx="10" fill="#13213C" stroke="#FCA311" stroke-opacity=".7"/>
      <text x="24" y="76" class="sans" fill="#FDFDFD" font-size="11" font-weight="800">99.97%</text>
      <text x="24" y="91" class="sans" fill="#a8afbc" font-size="9" font-weight="600">crash-free users</text>
      <rect x="14" y="110" width="104" height="10" rx="5" fill="#E5E5E5" fill-opacity=".18"/>
      <rect x="14" y="128" width="84" height="10" rx="5" fill="#E5E5E5" fill-opacity=".12"/>
      <rect x="14" y="150" width="104" height="44" rx="10" fill="#13213C" stroke="#E5E5E5" stroke-opacity=".2"/>
      <text x="24" y="170" class="sans" fill="#FDFDFD" font-size="11" font-weight="800">4.65★</text>
      <text x="24" y="185" class="sans" fill="#a8afbc" font-size="9" font-weight="600">Play Store rating</text>
      <rect x="14" y="206" width="104" height="30" rx="15" fill="none" stroke="#E5E5E5" stroke-opacity=".7"/>
      <text x="66" y="225" class="sans" fill="#E5E5E5" font-size="10" font-weight="700" text-anchor="middle">iOS</text>
    </g>

    <!-- Shared KMP core under both phones -->
    <path d="M66 258 V282 H216 V258" fill="none" stroke="#7F52FF" stroke-width="2" class="flow"/>
    <rect x="86" y="272" width="110" height="22" rx="11" fill="#030303" stroke="#7F52FF"/>
    <text x="141" y="287" class="mono" fill="#C9B8FF" font-size="11" text-anchor="middle">shared KMP core</text>

    <!-- API link -->
    <path d="M282 140 H360" fill="none" stroke="#FCA311" stroke-width="2" class="flow"/>
    <text x="321" y="130" class="mono" fill="#FCA311" font-size="11" text-anchor="middle">REST</text>

    <!-- Backend -->
    <g transform="translate(360 64)">
      <rect x="0" y="0" width="160" height="152" rx="14" fill="#0B1426" stroke="#6DB33F" stroke-opacity=".75" stroke-width="2"/>
      <text x="16" y="28" class="sans" fill="#FDFDFD" font-size="13" font-weight="800">Spring Boot API</text>
      <g class="mono" font-size="10.5" fill="#a8afbc">
        <circle cx="20" cy="52" r="3.5" fill="#6DB33F"/><text x="32" y="56">Spring Security</text>
        <circle cx="20" cy="76" r="3.5" fill="#6DB33F"/><text x="32" y="80">PostgreSQL</text>
        <circle cx="20" cy="100" r="3.5" fill="#6DB33F"/><text x="32" y="104">Kafka</text>
        <circle cx="20" cy="124" r="3.5" fill="#6DB33F"/><text x="32" y="128">Docker</text>
      </g>
    </g>
    <text x="440" y="246" class="mono" fill="#a8afbc" font-size="12" text-anchor="middle">one product system<tspan fill="#FCA311" class="blink">_</tspan></text>
  </g>
</svg>
